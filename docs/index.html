<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <meta
      name="description"
      id="metaDesc"
      content="Эндшпиль — пошаговый шахматный рогалик. Ты фигура, что меняет форму, спускаясь по ярусам Подземелья."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta property="og:title" id="metaOgTitle" content="Эндшпиль" />
    <meta
      property="og:description"
      id="metaOgDesc"
      content="Пошаговый шахматный рогалик. Двигайся или будь съеден."
    />
    <meta property="og:image" content="./cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title id="pageTitle">Эндшпиль</title>
    <script type="module" crossorigin src="./assets/index-Bm8vWUkp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Citav-F1.css">
  </head>
  <body>
    <div id="loadingScreen">
      <div class="loading-content">
        <img class="loading-logo" src="./assets/logo-ChAK2Kni.png" alt="" />
        <h2 class="loading-title">♟ Эндшпиль</h2>
        <p class="loading-lore"></p>
        <p class="loading-tip"></p>
        <p class="loading-hint i18n" data-key="loading.hint">Нажмите для продолжения</p>
      </div>
    </div>

    <h1 id="gameTitle">♟ Эндшпиль <span class="v">v1.0</span></h1>
    <div class="sub" id="gameSub">Двигайся или будь съеден</div>

    <div id="topbar">
      <div id="turnNo" class="hudbar"></div>
      <span class="badge shah i18n" data-key="shah" id="shah">Шах</span>
    </div>
    <div id="subbar">
      <div id="hungerBar" class="hudbar hunger-bar">
        <span class="hunger-label i18n" data-key="hud.hunger">Голод</span>
        <span class="hunger-ribs"></span>
      </div>
    </div>

    <div class="layout">
      <div class="board-wrap">
        <canvas id="board" width="616" height="504" aria-label="Board"></canvas>
        <div id="editorBar" style="display: none">
          <div id="editorActions" class="editor-tools"></div>
          <div id="editorTools" class="editor-tools"></div>
          <div class="editor-sep"></div>
          <div id="editorObjects" class="editor-tools"></div>
          <div id="editorStatus" class="editor-status">
            🖌 Editor · Pick an element and click the board
          </div>
        </div>

        <div class="card">
          <h2 class="i18n" data-key="ui.log">Log</h2>
          <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        </div>
      </div>

      <div class="side">
        <div class="card" id="controlCard">
          <h2 class="i18n" data-key="ui.wheel">Form Wheel</h2>
          <div class="wheel" id="wheel"></div>
          <div class="status">
            <span id="faceInfo"></span>
          </div>
          <div class="btnrow" id="primaryActions">
            <button id="btnCCW" title="Free">⟲ (Q)</button>
            <button id="btnCW" title="Free">⟳ (E)</button>
            <button id="btnPass" class="i18n" data-key="ui.pass">Pass (Space)</button>
          </div>
        </div>

        <div class="card">
          <h2 class="i18n" data-key="ui.menu">Menu</h2>
          <div class="btnrow" id="secondaryActions">
            <button id="btnHelp" class="i18n" data-key="ui.help">How to Play (?)</button>
            <button id="btnSettings" class="i18n" data-key="ui.settings">⚙ Settings</button>
            <button id="btnEditor" class="i18n" data-key="ui.editor">🗺 Editor</button>
            <button id="btnRestart" class="i18n" data-key="ui.restart">Restart (R)</button>
          </div>
        </div>

        <div class="card" id="relicCard" style="display: none">
          <div class="relics" id="relics"></div>
        </div>

        <div class="card">
          <details class="legend-details">
            <summary class="i18n" data-key="legend.title">Legend</summary>
            <div class="legend" id="legendBody"></div>
          </details>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div
        class="modal m-md"
        id="modalBox"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mTitle"
      >
        <div class="m-head" id="mHead">
          <img class="m-art" id="mArt" alt="" hidden />
          <h3 id="mTitle"></h3>
          <div id="mText"></div>
        </div>
        <div class="m-body" id="mBody">
          <div class="choices" id="mChoices"></div>
        </div>
        <div class="m-actions" id="mActions"></div>
      </div>
    </div>

  </body>
</html>
